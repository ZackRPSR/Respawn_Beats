<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Respawn Beats</title>
<link rel="stylesheet" href="assets/fonts/outfit.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent;overflow:hidden;user-select:none;-webkit-user-select:none;font-family:"Outfit",system-ui,sans-serif}
html,body{height:100%}
body{display:flex;align-items:center;justify-content:center}
.w{container-type:inline-size;width:420px;flex:none}
.card{--card:#d9d9d9;--ink:#111;--bar:#2b2b2b;--ring:#7a7a7a;
  background:var(--card);color:var(--ink);border-radius:26cqw;padding:7cqw 8cqw 8cqw;
  display:flex;flex-direction:column;align-items:center;transition:background .6s,color .6s;position:relative;overflow:hidden;margin:0 auto}
.card>*{flex-shrink:0}
.anim .card{transition:width .56s cubic-bezier(.65,0,.35,1),height .56s cubic-bezier(.65,0,.35,1),border-radius .56s cubic-bezier(.65,0,.35,1),background .6s,color .6s}
.cover{position:relative;width:26cqw;height:26cqw;border-radius:8cqw;border:1.3cqw solid var(--ring);background:var(--ring);overflow:hidden;display:grid;place-items:center;transition:border-color .6s,background .6s,box-shadow .6s,opacity .25s var(--od,0s)}
.playing .cover{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 5cqw var(--ring)}}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover svg{width:44%;height:44%;fill:none;stroke:var(--card);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
.tt{margin:3.6cqw 0 0;width:72cqw;height:6.8cqw;overflow:hidden;font-size:5.4cqw;font-weight:700;letter-spacing:-.01em;line-height:6.8cqw;white-space:nowrap;text-align:center}
.tt span{display:inline-block;will-change:transform}
.tt.scroll{text-align:left;-webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}
.tt.scroll span{animation:tick var(--dur) linear infinite}
@keyframes tick{from{transform:translateX(var(--from))}to{transform:translateX(var(--to))}}
.wave{height:17cqw;margin-top:3.5cqw;display:flex;align-items:center;gap:.5cqw}
.wave i{display:block;width:.9cqw;border-radius:1cqw;background:var(--bar);height:1.2cqw;transition:background .6s}
.row{width:61cqw}
.vol{display:flex;justify-content:flex-end;align-items:center;margin-top:.5cqw;height:5cqw}
.vol button{padding:0;width:4.6cqw;height:4.6cqw}
.vol button svg{width:100%;height:100%;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#vslider{--p:80%;-webkit-appearance:none;appearance:none;width:0;opacity:0;height:3cqw;margin:0;background:transparent;cursor:pointer;transition:width .25s,margin .25s,opacity .2s}
.vol:hover #vslider,.vol.show #vslider,#vslider:focus-visible{width:24cqw;margin-right:1.4cqw;opacity:1}
#vslider::-webkit-slider-runnable-track{height:.7cqw;border-radius:1cqw;background:linear-gradient(90deg,var(--ink) var(--p),color-mix(in srgb,var(--ink) 28%,transparent) var(--p))}
#vslider::-webkit-slider-thumb{-webkit-appearance:none;width:2cqw;height:2cqw;border-radius:50%;background:var(--ink);margin-top:-.65cqw}
.bar{position:relative;height:3cqw;margin-top:1cqw;cursor:pointer;display:flex;align-items:center}
.bar::before{content:"";position:absolute;left:0;right:0;height:.7cqw;border-radius:1cqw;background:var(--ink)}
.dot{position:absolute;width:2cqw;height:2cqw;border-radius:50%;background:var(--ink);left:0;transform:translateX(-50%)}
.ctl{display:flex;align-items:center;justify-content:space-between;width:61cqw;margin-top:3.5cqw}
button{all:unset;cursor:pointer;display:grid;place-items:center;color:var(--ink);transition:transform .15s,opacity .2s}
button:hover{transform:scale(1.1)}button:active{transform:scale(.92)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:50%}
.ico{width:5.6cqw;height:5.6cqw}
.ico.s{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ico.f{fill:currentColor;width:7cqw;height:7cqw}
.play{width:11.5cqw;height:11.5cqw;border-radius:50%;background:var(--ink);color:var(--card)}
.play svg{width:4.6cqw;height:4.6cqw;fill:currentColor}
.dim{opacity:.55}
.tt,.row,.ctl{transition:opacity .25s var(--od,0s)}
.wave{transition:transform .56s cubic-bezier(.65,0,.35,1)}
.deco .cover,.deco .tt,.deco .row,.deco .ctl{opacity:0;pointer-events:none}
.expanding{--od:.3s}
.boot *{transition:none!important}
.live,.live *{transition-duration:.1s!important}
@media (prefers-reduced-motion:reduce){.playing .cover,.tt.scroll span{animation:none}}
</style>
</head>
<body>
<div class="w" id="w"><div class="card" id="card">
  <div class="cover"><img id="cov" alt="" hidden>
    <svg id="ph" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg></div>
  <h1 class="tt" id="tt"><span id="title">Add songs to start</span></h1>
  <div class="wave" id="wave" aria-hidden="true"></div>
  <div class="row">
    <div class="vol" id="volbox"><input type="range" id="vslider" min="0" max="100" value="80" aria-label="Volume"><button id="vbtn" aria-label="Mute"></button></div>
    <div class="bar" id="bar"><div class="dot" id="dot"></div></div>
  </div>
  <div class="ctl">
    <button class="dim" id="queue" aria-label="Add songs"><svg class="ico s" viewBox="0 0 24 24"><path d="M3 5h15M3 9.5h15M3 14h9M3 18.5h6"/><path d="M17 20.5V12l4 1.5"/><circle cx="15" cy="20.5" r="2"/></svg></button>
    <button id="prev" aria-label="Previous"><svg class="ico f" viewBox="0 0 24 24"><rect x="3" y="5" width="3" height="14" rx=".6"/><path d="M20 5.2v13.6a.8.8 0 0 1-1.2.7L8 12.7a.8.8 0 0 1 0-1.4l10.8-6.8a.8.8 0 0 1 1.2.7z"/></svg></button>
    <button class="play" id="play" aria-label="Play"></button>
    <button id="next" aria-label="Next"><svg class="ico f" viewBox="0 0 24 24"><rect x="18" y="5" width="3" height="14" rx=".6"/><path d="M4 5.2v13.6a.8.8 0 0 0 1.2.7L16 12.7a.8.8 0 0 0 0-1.4L5.2 4.5A.8.8 0 0 0 4 5.2z"/></svg></button>
    <button class="dim" id="rep" aria-label="Repeat"><svg class="ico s" viewBox="0 0 24 24"><path d="M7 7h10a3 3 0 0 1 3 3v1M17 17H7a3 3 0 0 1-3-3v-1"/><path d="M15 4l3 3-3 3M9 14l-3 3 3 3"/></svg></button>
  </div>
</div></div>
<script src="renderer.js"></script>
</body>
</html>
